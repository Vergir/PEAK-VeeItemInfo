[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "vergir"
name = "VeeItemInfo"
description = "Shows what the item in your hands does - status changes, reach, weight and whether to cook it."
websiteUrl = "https://github.com/Vergir/PEAK-VeeItemInfo"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.75301"

[build]
icon = "../../icon.png"
readme = "../../README_FOR_THUNDERSTORE.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/VeeItemInfo/release/com.github.vergir.VeeItemInfo.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# LICENSE points at this file for the one piece of artwork the mod ships.
[[build.copy]]
source = "../../assets/NOTICE.md"
target = "assets/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "peak", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/peak/category/
peak = [ "mods", ]
